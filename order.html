<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 방식 주문 — 내 방식 QR</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="wrap" id="app"></main>
<p id="live" class="sr-only" aria-live="polite"></p>
<div class="wrap callbar" id="bar">
  <button id="staff" class="ghost" type="button">직원 부르기</button>
  <button id="cartbtn" class="ghost" type="button">담은 것 <span id="cartn">0</span></button>
</div>
<script type="module">
import { loadProfile, profileFromUrl, applyProfile, loadStore, viewItem, won, speak, channel, el, CODES, hasKoreanVoice } from "./js/common.js";

const qs = new URLSearchParams(location.search);
const k = /^\d{4}$/.test(qs.get("k") || "") ? qs.get("k") : ""; // v0.3: 네 자리 숫자만
let profile = profileFromUrl() || loadProfile();
const app = document.getElementById("app");
const store = await loadStore();
const cart = [];
let codes = applyProfile(profile);
let firstScreen = true;
let keepFocusKey = null; // v0.3(A): 한 화면 모드에서 고른 뒤 다시 그릴 때 포커스를 누른 단추에 그대로
// 손님에게 보이는 출처 표시(개발 용어 대신 — 1차 모의 심사 E)
const SOURCE_LABEL = { "AI 쉬운 말": "쉬운 말 설명", "사전 치환(원문 유지)": "쉬운 낱말로 바꾼 매장 설명", "매장 원문(쉬운 말 실패)": "매장 설명 그대로", "원문": "매장 설명 그대로" };

function say(text) { if (codes.has("VOICE")) speak(text, true); }
function screen(title, ...body) {
  const readBtn = codes.has("VOICE") ? el("button", { type: "button", class: "ghost", onclick: () => speak(app.innerText, true) }, "다시 읽기") : null;
  // v0.3(1차 모의 심사 A): 단계마다 제목(h1), 바뀐 안내는 aria-live 한 줄로만, 첫 화면은 포커스를 옮기지 않음(시연 화면 안에서 쪽이 저절로 내려가지 않게)
  app.replaceChildren(el("div", { class: "row" }, el("h1", { class: "step-title grow", tabindex: "-1" }, title), readBtn), ...body.filter(Boolean));
  document.getElementById("live").textContent = title;
  // v0.3(A): 읽어 주기를 켰는데 이 기기에 한국어 음성이 없으면 알림
  if (codes.has("VOICE") && hasKoreanVoice() === false) app.prepend(el("div", { class: "card notice", role: "status" }, "이 휴대폰에서는 읽어 주기를 할 수 없어요. 어려우면 아래 「직원 부르기」를 누르세요."));
  if (keepFocusKey) {
    const b = app.querySelector(`[data-k="${keepFocusKey}"]`); keepFocusKey = null;
    if (b) { b.focus({ preventScroll: true }); firstScreen = false; say(title); return; }
  }
  if (!firstScreen) {
    window.scrollTo(0, 0);
    const h = app.querySelector("h1"); if (h) h.focus({ preventScroll: true });
  }
  firstScreen = false;
  say(title);
  document.getElementById("cartn").textContent = cart.length;
}

function start() {
  if (!profile) {
    screen("내 방식이 아직 없어요",
      el("p", {}, "큰 글씨·쉬운 말·읽어 주기 같은 설정을 먼저 고르면, 이 매장 메뉴가 그 방식으로 보여요."),
      el("a", { class: "btn block", href: `my.html?next=${encodeURIComponent(location.pathname.split("/").pop() + location.search)}` }, "내 방식 정하기"),
      el("button", { type: "button", class: "block ghost", onclick: () => { profile = { codes: [] }; codes = applyProfile(profile); home(); } }, "기본 화면으로 계속"));
    return;
  }
  home();
}

function home() {
  const on = [...codes].map((c) => CODES[c].label);
  const cats = [...new Set(store.menu.items.map((i) => i.category))];
  screen(`${store.menu.store} — 무엇을 드릴까요?`,
    el("p", { class: "sub small" }, on.length ? `내 방식: ${on.join(" · ")}` : "기본 화면"),
    ...cats.map((c) => el("button", { type: "button", class: "block", onclick: () => list(c) }, c)),
    el("p", { class: "sub small" }, `${k ? `키오스크 번호 ${k} 매장의 메뉴를 보고 있어요.` : "매장 메뉴를 보고 있어요."} 가격은 매장 원래 가격 그대로예요. (시제품은 기기 사이 실시간 연결이 없어요 — 한 기기 시연 화면에서만 키오스크에 표시돼요)`));
}

function list(cat) {
  const items = store.menu.items.filter((i) => i.category === cat).map((i) => viewItem(i, store, codes.has("EASY")));
  screen(`${cat} — 하나를 고르세요`,
    ...items.map((v) => el("button", { type: "button", class: "block ghost", style: "flex-direction:column; align-items:flex-start; text-align:left",
      onclick: () => item(v) },
      el("span", { class: "row", style: "width:100%" }, el("b", { class: "grow" }, v.name), el("span", { class: "price" }, won(v.price))),
      el("span", { class: "sub", style: "font-weight:400" }, v.desc))),
    el("button", { type: "button", class: "block ghost", onclick: home }, "← 처음으로"));
}

function stepsOf(v) {
  // 고를 것: 온도(HOT/ICE) 하나 고르기 → 나머지 옵션은 '할까요?' 하나씩. 단계는 코드가 만든다(AI 관여 없음)
  const temp = v.rawOptions.map((o, i) => (o === "HOT" || o === "ICE") ? i : -1).filter((i) => i >= 0);
  const steps = [];
  if (temp.length >= 2) steps.push({ kind: "one", title: "따뜻하게, 차갑게 중 하나를 고르세요", idx: temp });
  else if (temp.length === 1) steps.push({ kind: "info", title: `${v.options[temp[0]]}만 있어요`, idx: temp });
  v.rawOptions.forEach((o, i) => { if (!temp.includes(i)) steps.push({ kind: "yn", title: `${v.options[i]} — 이렇게 할까요?`, idx: [i] }); });
  // v0.3(1차 모의 심사 E 재현 버그): 알레르기 정보가 있으면 한 가지씩 모드에서도 반드시 먼저 보여 주고 확인받는다(고를 것이 없는 메뉴 포함)
  if (v.allergy) steps.unshift({ kind: "allergy", title: `알레르기 정보를 확인하세요 — ${v.allergy}`, idx: [] });
  return steps;
}

function item(v) {
  const steps = stepsOf(v);
  const pick = { temp: null, on: new Set() };
  const head = [
    el("div", { class: "card" },
      el("div", { class: "row" }, el("b", { class: "grow" }, v.name), el("span", { class: "price" }, won(v.price))),
      el("p", {}, v.desc),
      el("span", { class: "tag " + (v.source === "AI 쉬운 말" ? "ai" : "orig") }, SOURCE_LABEL[v.source] || "매장 설명 그대로")),
    v.allergy ? el("div", { class: "card allergy" }, el("b", {}, "알레르기 정보(매장 원문)"), el("div", {}, v.allergy))
      : el("div", { class: "card allergy" }, el("b", {}, "알레르기 정보"), el("div", {}, "매장 자료에 알레르기 정보가 없어요. 걱정되면 「직원 부르기」로 물어보세요.")), // v0.3(A)
  ];
  const onePerScreen = codes.has("ONE");
  let si = 0;
  function render() {
    if (onePerScreen) {
      if (si >= steps.length) return review();
      const s = steps[si];
      screen(s.title, ...head, stepBox(s, true), el("button", { type: "button", class: "block ghost", onclick: () => (si > 0 ? (si--, render()) : list(v.category)) }, "← 뒤로"));
    } else {
      screen(v.name, ...head, ...steps.filter((s) => s.kind !== "allergy").map((s) => el("div", { class: "card" }, el("b", {}, s.title), stepBox(s, false))),
        el("button", { type: "button", class: "block", onclick: add }, "담기"),
        el("button", { type: "button", class: "block ghost", onclick: () => list(v.category) }, "← 다른 메뉴"));
    }
  }
  function stepBox(s, advance) {
    const next = (key) => { if (advance) { si++; render(); } else { keepFocusKey = key || null; render(); } };
    if (s.kind === "allergy") return el("button", { type: "button", class: "block", onclick: next }, "확인했어요");
    if (s.kind === "info") { if (advance) return el("button", { type: "button", class: "block", onclick: next }, "알겠어요"); return el("p", { class: "sub" }, "고를 것 없음"); }
    if (s.kind === "one") return el("div", { class: "choice" }, ...s.idx.map((i) =>
      el("button", { type: "button", "data-k": `one-${i}`, "aria-pressed": pick.temp === i ? "true" : "false", onclick: () => { pick.temp = i; next(`one-${i}`); } }, v.options[i])));
    const i = s.idx[0];
    const extra = v.extra[i] ? ` (+${won(v.extra[i])})` : "";
    return el("div", { class: "choice" },
      el("button", { type: "button", "data-k": `yes-${i}`, "aria-pressed": pick.on.has(i) ? "true" : "false", onclick: () => { pick.on.add(i); next(`yes-${i}`); } }, `네${extra}`),
      el("button", { type: "button", "data-k": `no-${i}`, "aria-pressed": !pick.on.has(i) ? "true" : "false", onclick: () => { pick.on.delete(i); next(`no-${i}`); } }, "아니요"));
  }
  function total() { return v.price + [...pick.on].reduce((s, i) => s + v.extra[i], 0); }
  function label() {
    const parts = [];
    if (pick.temp != null) parts.push(v.options[pick.temp]);
    for (const i of pick.on) parts.push(v.options[i]);
    return v.name + (parts.length ? ` (${parts.join(", ")})` : "");
  }
  function review() {
    screen("이대로 담을까요?", el("div", { class: "card" }, el("p", {}, label()), el("p", { class: "price" }, won(total()))),
      v.allergy ? el("div", { class: "card allergy" }, el("b", {}, "알레르기 정보(매장 원문)"), el("div", {}, v.allergy)) : null,
      el("button", { type: "button", class: "block", onclick: add }, "담기"),
      el("button", { type: "button", class: "block ghost", onclick: () => { si = 0; render(); } }, "처음부터 다시 고르기"));
  }
  function add() {
    if (steps.some((s) => s.kind === "one") && pick.temp == null) { say("따뜻하게, 차갑게 중 하나를 골라 주세요"); alert("따뜻하게, 차갑게 중 하나를 골라 주세요."); return; }
    cart.push({ label: label(), price: total() });
    screen("담았어요", el("div", { class: "card" }, el("p", {}, label()), el("p", { class: "price" }, won(total()))),
      el("button", { type: "button", class: "block", onclick: confirmOrder }, "주문 확인하기"),
      el("button", { type: "button", class: "block ghost", onclick: home }, "더 고르기"));
  }
  render();
}

function confirmOrder() {
  if (!cart.length) { screen("아직 담은 것이 없어요", el("button", { type: "button", class: "block", onclick: home }, "메뉴 보기")); return; }
  const sum = cart.reduce((s, c) => s + c.price, 0);
  screen("결제 전에 확인하세요",
    el("div", { class: "card" }, ...cart.map((c, i) => el("div", { class: "row" }, el("span", { class: "grow" }, `${i + 1}. ${c.label}`), el("span", { class: "price" }, won(c.price)),
      el("button", { type: "button", class: "ghost", "aria-label": `${c.label} 빼기`, onclick: () => { cart.splice(i, 1); confirmOrder(); } }, "빼기"))),
      el("p", { class: "price", style: "font-size:1.3em" }, `합계 ${won(sum)}`)),
    el("button", { type: "button", class: "block", onclick: () => pay(sum) }, "결제하기(시연)"),
    el("button", { type: "button", class: "block ghost", onclick: home }, "더 고르기"));
}

function pay(sum) {
  const no = "A-" + String(10 + Math.floor(Math.random() * 90));
  const lines = cart.map((c) => c.label);
  cart.length = 0; // v0.3(1차 모의 심사 B 실측): 결제하면 바로 비워 같은 주문이 두 번 들어가지 않게
  document.getElementById("cartn").textContent = 0;
  channel().postMessage({ type: "order", k, no, lines, total: sum });
  screen(`주문했어요 — 번호 ${no}`,
    el("div", { class: "card" }, el("p", {}, "시연이라 실제 결제는 되지 않았어요."), el("p", {}, `합계 ${won(sum)}`)),
    el("p", { class: "sub small" }, "실제 서비스에서는 이 주문이 키오스크로 넘어가 결제됩니다(시제품은 같은 기기 시연 화면에서만 키오스크에 표시)."),
    el("button", { type: "button", class: "block ghost", onclick: home }, "처음으로"));
}

document.getElementById("staff").onclick = () => {
  channel().postMessage({ type: "staff", k });
  screen("직원을 불렀어요", el("p", {}, "잠시만 기다려 주세요. (시연: 한 기기 시연 화면에서만 키오스크에 표시되고, 실제 호출은 되지 않아요)"), el("button", { type: "button", class: "block ghost", onclick: home }, "처음으로"));
};
document.getElementById("cartbtn").onclick = confirmOrder;
start();
</script>
</body>
</html>
