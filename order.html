<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 방식 주문 — 내 방식 QR</title>
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<main class="wrap" id="app"></main>
<p id="live" class="sr-only" aria-live="polite"></p>
<div class="wrap callbar" id="bar">
  <button id="staff" class="ghost" type="button">직원 부르기</button>
  <button id="cartbtn" class="ghost" type="button">담은 것 <span id="cartn">0</span></button>
</div>
<script type="module">
import { loadProfile, profileFromUrl, applyProfile, loadStore, viewItem, allergyBox, allergyLine, won, speak, channel, el, CODES, hasKoreanVoice, askOption } from "./js/common.js";
import { planFor } from "./js/plan.js";
import { encodeOrder } from "./js/orderqr.js";

const qs = new URLSearchParams(location.search);
const k = /^\d{4}$/.test(qs.get("k") || "") ? qs.get("k") : ""; // v0.3: 네 자리 숫자만
let profile = profileFromUrl() || loadProfile();
const app = document.getElementById("app");
const store = await loadStore();
const cart = [];
let codes = applyProfile(profile);
let P = null; // v0.6: 지금 기능 조합의 화면 구성안 { key, plan, fixes, verdict }
let firstScreen = true;
let keepFocusKey = null; // v0.3(A): 한 화면 모드에서 고른 뒤 다시 그릴 때 포커스를 누른 단추에 그대로
// 손님에게 보이는 출처 표시(개발 용어 대신 — 1차 내부 점검 E)
const SOURCE_LABEL = { "AI 쉬운 말": "쉬운 말 설명", "사전 치환(원문 유지)": "쉬운 낱말로 바꾼 매장 설명", "매장 원문(쉬운 말 실패)": "매장 설명 그대로", "원문": "매장 설명 그대로" };

// v0.6: AI 화면 구성안 적용 — 글씨·단추 크기는 구성안 값(검증에서 기능별 최소 기준을 지킴), 나머지는 화면을 그릴 때 씀
function applyPlan() {
  P = planFor(store.plans, [...codes]);
  const pl = P.plan;
  document.body.style.setProperty("--fs", (19 * pl.text_pct / 100).toFixed(1) + "px");
  document.body.style.setProperty("--btn-h", Math.round(48 * pl.button_pct / 100) + "px");
  document.body.style.setProperty("--gap", pl.button_pct >= 140 ? "18px" : "12px");
}
applyPlan();
const reads = (what) => codes.has("VOICE") && P.plan.read.includes(what);

// v0.6(3차 내부 점검 B): 브라우저 '뒤로'로 앞 화면에 — 큰 화면 이동(목록·메뉴·주문 확인)만 기록
const nav = [];
function go(fn) { nav.push(fn); try { history.pushState({ myway: nav.length }, ""); } catch (e) { /* 무시 */ } fn(); }
window.addEventListener("popstate", () => { nav.pop(); const f = nav[nav.length - 1]; (f || home)(); });

function say(text) { if (codes.has("VOICE")) speak(text, true); }
function screen(title, ...body) {
  const readBtn = codes.has("VOICE") ? el("button", { type: "button", class: "ghost", onclick: () => speak(app.innerText, true) }, "다시 읽기") : null;
  // v0.3(1차 내부 점검 A): 단계마다 제목(h1), 바뀐 안내는 aria-live 한 줄로만, 첫 화면은 포커스를 옮기지 않음(시연 화면 안에서 쪽이 저절로 내려가지 않게)
  app.replaceChildren(el("div", { class: "row" }, el("h1", { class: "step-title grow", tabindex: "-1" }, title), readBtn), ...body.filter(Boolean));
  document.getElementById("live").textContent = title;
  // v0.3(A): 읽어 주기를 켰는데 이 기기에 한국어 음성이 없으면 알림
  if (codes.has("VOICE") && hasKoreanVoice() === false) app.prepend(el("div", { class: "card notice", role: "status" }, "이 휴대폰에서는 읽어 주기를 할 수 없어요. 어려우면 아래 「직원 부르기」를 누르세요."));
  if (keepFocusKey) {
    const b = app.querySelector(`[data-k="${keepFocusKey}"]`); keepFocusKey = null;
    if (b) { b.focus({ preventScroll: true }); firstScreen = false; return; }
  }
  if (!firstScreen) {
    window.scrollTo(0, 0);
    const h = app.querySelector("h1"); if (h) h.focus({ preventScroll: true });
  }
  firstScreen = false;
  if (reads("제목")) say(title);
  document.getElementById("cartn").textContent = cart.length;
}

function start() {
  if (!profile) {
    screen("내 방식이 아직 없어요",
      el("p", {}, "큰 글씨·쉬운 말·읽어 주기 같은 설정을 먼저 고르면, 이 매장 메뉴가 그 방식으로 보여요."),
      el("a", { class: "btn block", href: `my.html?next=${encodeURIComponent(location.pathname.split("/").pop() + location.search)}` }, "내 방식 정하기"),
      el("button", { type: "button", class: "block ghost", onclick: () => { profile = { codes: [] }; codes = applyProfile(profile); applyPlan(); home(); } }, "기본 화면으로 계속"));
    return;
  }
  home();
}

function home() {
  nav.length = 0;
  const on = [...codes].map((c) => CODES[c].label);
  const cats = [...new Set(store.menu.items.map((i) => i.category))];
  screen(`${store.menu.store} — 무엇을 드릴까요?`,
    P.plan.greeting ? el("p", { class: "greet" }, P.plan.greeting) : null, // v0.6: AI 구성안의 안내 한 줄(검증 통과분, 아니면 기본 문장)
    el("p", { class: "sub small" }, on.length ? `내 방식: ${on.join(" · ")}` : "기본 화면"),
    ...cats.map((c) => el("button", { type: "button", class: "block", onclick: () => go(() => list(c)) }, c)),
    el("p", { class: "sub small" }, `${k ? `키오스크 번호 ${k} 매장의 메뉴를 보고 있어요.` : "매장 메뉴를 보고 있어요."} 가격은 매장 원래 가격 그대로예요.`),
    lastQR() ? el("button", { type: "button", class: "block ghost", onclick: () => go(() => showOrderQR(lastQR())) }, "방금 만든 주문 QR 다시 보기") : null, // v0.7(4차 내부 점검 E·B)
    el("p", { class: "sub small plan-note" }, `화면 구성: ${P.verdict.startsWith("AI") ? "AI가 만든 구성안을 규칙으로 검증" + (P.fixes.length ? `(보정 ${P.fixes.length})` : "") + (store.plans && store.plans.review ? ` · ${store.plans.review}` : "") : "기본 구성"}`));
  if (reads("제목") && P.plan.greeting) say(`${store.menu.store}, 무엇을 드릴까요? ${P.plan.greeting}`); // v0.7(A): 읽어 주기면 안내 한 줄도 읽음
}

// 목록에 보일 짧은 설명 — 첫 문장(마침표·쉼표 앞) 18자까지
const shortDesc = (d) => { const s = String(d).split(/[.。]/)[0].split(",")[0].trim(); return s.length > 18 ? s.slice(0, 17) + "…" : s; };
// v0.6: 목록은 구성안의 '한 번에 보일 수'만큼 먼저 보이고, 「메뉴 N개 더 보기」로 아래에 이어 붙인다(답변서2 4번 '스크롤 유도')
function list(cat, upto = 0) {
  const all = store.menu.items.filter((i) => i.category === cat).map((i) => viewItem(i, store, codes.has("EASY")));
  const per = P.plan.per_page, n = Math.min(all.length, upto || per);
  const show = P.plan.list_show;
  screen(`${cat} — 하나를 고르세요`,
    ...all.slice(0, n).map((v, idx) => el("button", { type: "button", class: "block ghost", "data-k": `it-${idx}`, style: "flex-direction:column; align-items:flex-start; text-align:left",
      onclick: () => go(() => item(v)) },
      el("span", { class: "row", style: "width:100%" }, el("b", { class: "grow" }, v.name), el("span", { class: "price" }, won(v.price))),
      show === "이름·가격" ? null : el("span", { class: "sub", style: "font-weight:400" }, show === "이름·가격·짧은 설명" ? shortDesc(v.desc) : v.desc))),
    n < all.length ? el("button", { type: "button", class: "block more", onclick: () => { keepFocusKey = `it-${n}`; list(cat, n + per); } }, `↓ 메뉴 ${all.length - n}개 더 보기`) : null,
    el("button", { type: "button", class: "block ghost", onclick: home }, "← 처음으로"));
}

function stepsOf(v) {
  // 고를 것: 온도(HOT/ICE) 하나 고르기 → 나머지 옵션은 손님 말로 하나씩 묻기. 단계는 코드가 만든다(AI 관여 없음)
  const temp = v.rawOptions.map((o, i) => (o === "HOT" || o === "ICE") ? i : -1).filter((i) => i >= 0);
  const steps = [];
  if (temp.length >= 2) steps.push({ kind: "one", title: "따뜻하게, 차갑게 중 하나를 고르세요", idx: temp });
  else if (temp.length === 1) steps.push({ kind: "info", title: `${v.options[temp[0]]}만 있어요`, idx: temp });
  v.rawOptions.forEach((o, i) => { if (!temp.includes(i)) steps.push({ kind: "yn", title: askOption(v.options[i]), idx: [i] }); });
  return steps;
}

function item(v) {
  const steps = stepsOf(v);
  const pick = { temp: null, on: new Set(), ans: new Set() }; // ans: 네/아니요를 실제로 누른 질문(v0.7 E: 「아니요」가 처음부터 눌린 것처럼 보임)
  let onePerScreen = P.plan.options === "하나씩";
  let fold = P.plan.detail === "접기";
  let guard = null;       // v0.6 실행 중 보정: 이 화면에서 '담기'가 화면 밖이면 접기 → 하나씩
  let compact = false;    // v0.7(4차 내부 점검 C: 큰 글씨+읽어 주기에서 아메리카노 「확인했어요」가 아래 줄에 18~20px 가림) — 접어도 넘치면 제목을 줄임(이름·가격은 바로 아래 줄에 있음)
  let showDesc = codes.has("EASY"); // 접기일 때 설명을 보일지 — v0.7(4차 내부 점검 A·E): 쉬운 말을 고른 손님은 접는 구성에서도 설명을 단추 아래에 펼쳐 둠
  const descCard = (head = true) => el("div", { class: "card", id: "desccard" }, // head=false: 위에 이름·가격 줄(miniHead)이 이미 있을 때
    head ? el("div", { class: "row" }, el("b", { class: "grow" }, v.name), el("span", { class: "price" }, won(v.price))) : null,
    el("p", {}, v.desc),
    el("span", { class: "tag " + (v.source === "AI 쉬운 말" ? "ai" : "orig") }, (SOURCE_LABEL[v.source] || "매장 설명 그대로") + (v.review ? ` · ${v.review}` : ""))); // v0.5: 승인 상태
  // 고르는 화면의 짧은 머리(이름·가격) — 글씨 > 단추 > 설명(답변서2 4번)
  const miniHead = () => el("p", { class: "row" }, el("b", { class: "grow" }, v.name), el("span", { class: "price" }, won(v.price)));
  let si = onePerScreen ? -1 : 0;
  // 읽어 주기: 구성안이 정한 것(가격·알레르기는 검증이 반드시 넣음)을 이 순서로
  const sayItem = (lead) => {
    if (!codes.has("VOICE")) return;
    const parts = [lead || v.name];
    if (reads("가격")) parts.push(won(v.price));
    if (reads("설명")) parts.push(v.desc);
    if (reads("옵션") && v.options.length) parts.push("고를 것: " + v.options.join(", "));
    if (reads("알레르기")) parts.push(allergyLine(v));
    say(parts.join(". "));
  };
  // v0.7.2(5차 내부 점검 A·D·E: 쉬운 말+큰 글씨에서 설명은 단추 아래에 펼쳐져 있는데 「설명 접기」·「설명을 접었어요」가 함께 떠 상태와 반대로 읽힘)
  //   → 쉬운 말 손님에게는 접기 단추 대신 「설명은 아래에 있어요 ↓」(누르면 설명으로 이동 — 큰 글씨에서도 한 줄), 안내도 「설명은 단추 아래에 두었어요」
  const descToggle = () => codes.has("EASY")
    ? el("button", { type: "button", class: "block ghost", "data-k": "desc", onclick: () => { const c = document.getElementById("desccard"); if (c) { c.scrollIntoView({ block: "center" }); c.setAttribute("tabindex", "-1"); c.focus({ preventScroll: true }); } } }, "설명은 아래에 있어요 ↓")
    : el("button", { type: "button", class: "block ghost", "aria-expanded": showDesc ? "true" : "false", "data-k": "desc",
    onclick: () => { showDesc = !showDesc; keepFocusKey = "desc"; render(); } }, showDesc ? "설명 접기" : "설명 보기");
  const FOLD_MSG = codes.has("EASY") ? "화면에 다 들어가지 않아 설명은 단추 아래에 두었어요" : "화면에 다 들어가지 않아 설명을 접었어요";
  // 단추 아래끝이 '직원 부르기' 줄 위(이 기기의 실제 화면 높이)를 넘는지
  const overLimit = (b) => { const bar = document.getElementById("bar"); return b.getBoundingClientRect().bottom > window.innerHeight - (bar ? bar.getBoundingClientRect().height : 0); };
  function render() {
    const again = keepFocusKey != null; // 옵션을 눌러 다시 그릴 때는 되풀이해 읽지 않음
    if (onePerScreen) {
      if (si < 0) {
        // 접기: 이름·가격 → 알레르기 → 확인 단추 → 설명 보기(글씨 > 단추 > 설명, 답변서2 4번) / 펼침: 설명 → 알레르기 → 확인 단추
        const okBtn = el("button", { type: "button", class: "block", "data-act": "ok", onclick: () => { si = 0; render(); } }, steps.length ? "확인했어요 — 고르기 시작" : "확인했어요");
        screen(compact ? "설명과 알레르기를 확인하세요" : `${v.name} — 설명과 알레르기를 확인하세요`,
          ...(fold ? [miniHead(), allergyBox(v), okBtn, descToggle(), showDesc ? descCard(false) : null] : [descCard(), allergyBox(v), okBtn]), // v0.7(A): 「설명 보기」 단추 뒤에 설명(화면 읽기 순서)
          guard ? el("p", { class: "sub small" }, guard) : null, // 보정 안내는 단추 아래(첫 화면 높이를 쓰지 않게)
          el("button", { type: "button", class: "block ghost", onclick: () => list(v.category) }, "← 다른 메뉴"));
        if (!again) {
          // v0.6 실행 중 보정 — 확인 단추가 아래 단추 줄에 가리거나 화면 밖이면 설명을 접음
          if (!fold && overLimit(okBtn)) { fold = true; guard = guard || FOLD_MSG; return render(); }
          if (fold && !compact && overLimit(okBtn)) { compact = true; return render(); }
          // v0.7.2(10-24 실측: 디카페인 아메리카노 × 큰 글씨+읽어 주기 16조합에서 확인 단추 아래 24~36px가 단추 줄에 걸림) — 제목까지 줄여도 넘치면 확인 단추가 단추 줄 위에 다 보이게 쪽을 내림(제목 위쪽만 가려짐)
          if (fold && compact && overLimit(okBtn)) { const bar = document.getElementById("bar"); window.scrollBy(0, Math.ceil(okBtn.getBoundingClientRect().bottom - (window.innerHeight - (bar ? bar.getBoundingClientRect().height : 0)) + 8)); }
          sayItem();
        }
        return;
      }
      if (si >= steps.length) return review();
      const s = steps[si];
      screen(s.title, miniHead(), stepBox(s, true), el("button", { type: "button", class: "block ghost", onclick: () => { si--; render(); } }, "← 뒤로"));
      return;
    }
    const descPart = fold ? [descToggle(), showDesc ? descCard(false) : null] : [descCard()];
    // 접기: 이름·가격 → 알레르기 → 고를 것 → 담기 → 설명 보기 / 펼침: 설명 → 알레르기 → 고를 것 → 담기
    screen(v.name, fold ? miniHead() : null, ...(fold ? [] : descPart), allergyBox(v),
      ...steps.map((s) => el("div", { class: "card" }, el("b", {}, s.title), stepBox(s, false))),
      el("button", { type: "button", class: "block", "data-act": "add", onclick: add }, "담기"),
      ...(fold ? descPart : []),
      guard ? el("p", { class: "sub small" }, guard) : null,
      el("button", { type: "button", class: "block ghost", onclick: () => list(v.category) }, "← 다른 메뉴"));
    if (!again) {
      // v0.6 실행 중 보정 — 이 기기 화면에서 '담기'가 아래 단추 줄에 가리거나 화면 밖이면(구성안 검증은 어림이라) 설명을 접고, 그래도 넘치면 하나씩 묻기
      const b = app.querySelector('[data-act="add"]');
      if (b && overLimit(b)) {
        if (!fold) { fold = true; guard = FOLD_MSG; return render(); }
        // v0.7(4차 내부 점검 A·B·E): 하나씩으로 바꾸면 설명 접기를 구성안대로 되돌리고 다시 잼(자리가 남으면 펼친 채) · 안내는 실제 이유대로
        onePerScreen = true; si = -1; fold = P.plan.detail === "접기"; guard = "화면에 다 들어가지 않아 하나씩 물어볼게요"; return render();
      }
      sayItem();
    }
  }
  function stepBox(s, advance) {
    const next = (key) => { if (advance) { si++; render(); } else { keepFocusKey = key || null; render(); } };
    if (s.kind === "info") { if (advance) return el("button", { type: "button", class: "block", onclick: next }, "알겠어요"); return el("p", { class: "sub" }, "고를 것 없음"); }
    if (s.kind === "one") return el("div", { class: "choice" }, ...s.idx.map((i) =>
      el("button", { type: "button", "data-k": `one-${i}`, "aria-pressed": pick.temp === i ? "true" : "false", onclick: () => { pick.temp = i; next(`one-${i}`); } }, v.options[i])));
    const i = s.idx[0];
    const extra = v.extra[i] ? ` (+${won(v.extra[i])})` : "";
    return el("div", { class: "choice" },
      el("button", { type: "button", "data-k": `yes-${i}`, "aria-pressed": pick.on.has(i) ? "true" : "false", onclick: () => { pick.on.add(i); pick.ans.add(i); next(`yes-${i}`); } }, `네${extra}`),
      el("button", { type: "button", "data-k": `no-${i}`, "aria-pressed": pick.ans.has(i) && !pick.on.has(i) ? "true" : "false", onclick: () => { pick.on.delete(i); pick.ans.add(i); next(`no-${i}`); } }, "아니요"));
  }
  function total() { return v.price + [...pick.on].reduce((s, i) => s + v.extra[i], 0); }
  function label() {
    const parts = [];
    if (pick.temp != null) parts.push(v.options[pick.temp]);
    for (const i of pick.on) parts.push(v.options[i]);
    return v.name + (parts.length ? ` (${parts.join(", ")})` : "");
  }
  function review() {
    screen("이대로 담을까요?", el("div", { class: "card" }, el("p", {}, label()), el("p", { class: "price" }, won(total()))),
      allergyBox(v), // v0.4: 담기 직전에도 항상(정보가 없으면 '직원에게 확인')
      el("button", { type: "button", class: "block", onclick: add }, "담기"),
      el("button", { type: "button", class: "block ghost", onclick: () => { si = steps.length ? steps.length - 1 : -1; render(); } }, "← 뒤로"),
      el("button", { type: "button", class: "block ghost", onclick: () => { si = -1; pick.temp = null; pick.on.clear(); pick.ans.clear(); render(); } }, "처음부터 다시 고르기"));
    say(`이대로 담을까요? ${v.name}. ${allergyLine(v)}`); // v0.5.1: 담기 직전에도 알레르기 문장까지 읽음
  }
  function add() {
    if (steps.some((s) => s.kind === "one") && pick.temp == null) { say("따뜻하게, 차갑게 중 하나를 골라 주세요"); alert("따뜻하게, 차갑게 중 하나를 골라 주세요."); return; }
    // v0.4: 키오스크가 자기 가격표로 다시 계산하도록 메뉴 id·고른 옵션 번호도 함께 담는다
    cart.push({ id: v.id, temp: pick.temp, on: [...pick.on], label: label(), price: total() });
    screen("담았어요", el("div", { class: "card" }, el("p", {}, label()), el("p", { class: "price" }, won(total()))),
      el("button", { type: "button", class: "block", onclick: () => go(confirmOrder) }, "주문 확인하기"),
      el("button", { type: "button", class: "block ghost", onclick: home }, "더 고르기"));
  }
  render();
}

function confirmOrder() {
  if (!cart.length) { screen("아직 담은 것이 없어요", el("button", { type: "button", class: "block", onclick: home }, "메뉴 보기"),
    lastQR() ? el("button", { type: "button", class: "block ghost", onclick: () => go(() => showOrderQR(lastQR())) }, "방금 만든 주문 QR 다시 보기") : null); return; }
  const sum = cart.reduce((s, c) => s + c.price, 0);
  const byId = Object.fromEntries(store.menu.items.map((i) => [i.id, i]));
  // v0.5: 품목마다 알레르기 한 줄(담기 화면의 상자와 같은 근거)
  screen("결제 전에 확인하세요",
    el("div", { class: "card" }, ...cart.map((c, i) => el("div", { class: "cartline" },
      el("div", { class: "row" }, el("span", { class: "grow" }, `${i + 1}. ${c.label}`), el("span", { class: "price" }, won(c.price)),
        el("button", { type: "button", class: "ghost", "aria-label": `${c.label} 빼기`, onclick: () => { cart.splice(i, 1); confirmOrder(); } }, "빼기")),
      el("div", { class: "allergy-line" }, allergyLine(viewItem(byId[c.id], store, codes.has("EASY")))))),
      el("p", { class: "price", style: "font-size:1.3em" }, `합계 ${won(sum)}`),
      el("p", { class: "sub small" }, "결제는 키오스크에서 해요. 금액은 키오스크 가격표로 다시 계산돼요.")),
    el("button", { type: "button", class: "block", onclick: () => sendToKiosk(sum) }, "키오스크로 주문 보내기(시연)"),
    el("button", { type: "button", class: "block ghost", onclick: home }, "더 고르기"));
  // v0.5.1: 읽어 주기 — 품목마다 알레르기 문장까지
  say("결제 전에 확인하세요. " + cart.map((c) => `${c.label}. ${allergyLine(viewItem(byId[c.id], store, codes.has("EASY")))}`).join(" "));
}

// v0.6(3차 내부 점검 B·D: 「결제하기」 → 「키오스크로 주문 보내기」, 주문 번호는 키오스크가 발급) — 서버 없이 주문 QR로 넘김.
// 한 기기 시연 화면에서는 같은 기기 채널로도 보내고, 키오스크가 발급한 번호를 받아 크게 보여 준다
// v0.7(4차 내부 점검 B·D): 주문마다 고유값(ref)을 QR에 넣어 키오스크가 같은 QR을 두 번 받지 않게 · (E·B) 방금 만든 QR은 이 탭에 보관해 뒤로·처음으로 뒤에도 다시 보기
let sentRef = null;
const LASTQR = "mywayqr.lastqr";
function lastQR() { try { const x = JSON.parse(sessionStorage.getItem(LASTQR) || "null"); return x && x.code && Date.now() - x.at < 60 * 60 * 1000 ? x : null; } catch (e) { return null; } }
function sendToKiosk(sum) {
  const items = cart.map((c) => ({ id: c.id, temp: c.temp, on: c.on }));
  sentRef = Math.random().toString(36).slice(2, 6).padEnd(4, "0");
  const code = encodeOrder(store.menu.store_id, store.menu.menu_ver || "", k, items, sentRef);
  const lines = cart.map((c) => c.label);
  cart.length = 0; // v0.3: 보내면 바로 비워 같은 주문이 두 번 들어가지 않게
  document.getElementById("cartn").textContent = 0;
  const last = { code, sum, ref: sentRef, at: Date.now() };
  try { sessionStorage.setItem(LASTQR, JSON.stringify(last)); } catch (e) { /* 저장 못 하면 다시 보기만 없음 */ }
  channel().postMessage({ type: "order", k, ref: sentRef, lines, items, total: sum, mwq: code });
  go(() => showOrderQR(last));
}
function showOrderQR(last) {
  sentRef = last.ref;
  const qrBox = el("div", { class: "qrbox", id: "orderqr" });
  try { const q = qrcode(0, "M"); q.addData(last.code); q.make(); qrBox.innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); const svg = qrBox.querySelector("svg"); if (svg) { svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "내 방식 주문 QR — 키오스크의 「주문 QR 읽기」 카메라에 보여 주세요"); } }
  catch (e) { qrBox.textContent = "QR을 그리지 못했어요 — 직원에게 이 화면을 보여 주세요"; }
  // v0.7.1(10-23 영상 재캡처에서 발견: 390×844 큰 글씨에서 3단계 안내가 QR을 밀어 QR 아래가 「직원 부르기」 줄에 가림 — 화면을 내려야 키오스크에 비출 수 있었음)
  //   → QR을 제목 바로 아래, 3단계 안내는 QR 바로 아래(문구 그대로). 그래도 첫 화면에 다 안 들어가면 QR을 남은 높이에 맞게 줄이고(fitOrderQR)
  screen("키오스크 카메라에 이 QR을 보여 주세요",
    qrBox,
    // v0.7(4차 내부 점검 E): 다음 할 일을 보이는 글로(전에는 aria-label에만 있었음)
    el("ol", { class: "steps" }, el("li", {}, "키오스크 화면에서 「주문 QR 읽기」를 누르세요"), el("li", {}, "이 QR을 키오스크 카메라에 비추세요"), el("li", {}, "주문 번호는 키오스크 화면에 나오고, 소리로도 알려 줘요")),
    el("p", { class: "issued", id: "issued", "aria-live": "off" }, "주문 번호는 키오스크가 알려 줘요"),
    el("div", { class: "card" }, el("p", {}, `합계 ${won(last.sum)} — 결제는 키오스크에서 해요(시연이라 실제 결제는 되지 않아요).`),
      el("p", { class: "sub small" }, "QR에는 메뉴와 고른 옵션 번호, 같은 주문을 두 번 받지 않게 하는 주문 표시 네 글자만 들어 있어요(금액·내 방식 설정은 넣지 않음). 키오스크가 자기 가격표로 다시 계산해요.")),
    el("details", { class: "small" }, el("summary", {}, "QR 내용 보기"), el("code", { id: "mwq" }, last.code)),
    el("button", { type: "button", class: "block ghost", onclick: home }, "처음으로"));
  fitOrderQR(true);
  say("키오스크에서 주문 큐알 읽기를 누르고, 이 큐알을 카메라에 비추세요. 결제는 키오스크에서 해요.");
}
// v0.7.1: 주문 QR(흰 여백 포함)이 첫 화면에서 아래 단추 줄 위에 다 보이게 — 넘치면 QR을 줄이고(최소 QR_MIN), 그래도 넘치면 QR이 다 보이게 쪽을 내림
//   QR_MIN 180px = 품목 1~5개 주문 QR(여백 포함 37~45칸)에서 한 칸 4~5px(휴대폰 화면에서 약 3cm) · 화면 방향이 바뀌면(폭이 바뀌면) 다시 맞춤
const QR_MAX = 240, QR_MIN = 180;
function fitOrderQR(scroll) {
  const box = document.getElementById("orderqr"), svg = box && box.querySelector("svg");
  if (!svg) return;
  const bar = document.getElementById("bar");
  const limit = window.innerHeight - (bar ? bar.getBoundingClientRect().height : 0) - 8; // 아래 단추 줄 윗선보다 8px 위
  svg.style.width = svg.style.height = "";
  const over = box.getBoundingClientRect().bottom - limit;
  if (over > 0) { const s = Math.max(QR_MIN, Math.floor(QR_MAX - over)); svg.style.width = svg.style.height = s + "px"; }
  if (scroll) { const b = box.getBoundingClientRect().bottom; if (b > limit) window.scrollBy(0, Math.ceil(b - limit)); }
}
let lastW = window.innerWidth;
window.addEventListener("resize", () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; fitOrderQR(false); }); // 주소창이 숨거나 나올 때(높이만 바뀜)는 그대로
channel().addEventListener("message", (ev) => {
  const m = ev.data || {};
  if (m.type !== "issued" || !sentRef || m.ref !== sentRef) return;
  const box = document.getElementById("issued");
  if (box) box.replaceChildren(el("b", { class: "no" }, `주문 번호 ${String(m.no).slice(0, 8)}`), el("span", {}, "키오스크가 발급했어요")); // v0.7(B·E): 번호 줄이 잘리지 않게(줄바꿈 허용, 번호만 크게)
  document.getElementById("live").textContent = `주문 번호 ${m.no}`;
  say(`주문 번호, ${String(m.no).split("").join(" ")}`);
});

// v0.7(4차 내부 점검 A·B·E): 두 기기(실제 휴대폰)에서는 호출 신호가 가지 않으므로, 직원에게 보여 줄 큰 글 화면으로. 한 기기 시연 화면 안에서만 키오스크에 표시
const inDemo = (() => { try { return window.top !== window; } catch (e) { return true; } })();
function closeStaffNote() { const n = document.getElementById("staffnote"); if (n) n.remove(); document.documentElement.style.scrollPaddingTop = ""; document.body.style.paddingTop = ""; }
document.getElementById("staff").onclick = () => {
  channel().postMessage({ type: "staff", k });
  // v0.4·v0.5: 하던 주문을 지우지 않고, 화면 위에 고정한 알림만
  closeStaffNote();
  const note = inDemo
    ? el("div", { class: "card notice staffnote", id: "staffnote", role: "status" },
        el("b", {}, "직원을 불렀어요"), el("p", {}, "잠시만 기다려 주세요. 하던 주문은 그대로 있어요. (시연: 한 기기 시연 화면에서만 키오스크에 표시되고, 실제 호출은 되지 않아요)"),
        el("button", { type: "button", class: "ghost", onclick: closeStaffNote }, "알림 닫기"))
    : el("div", { class: "card notice staffnote big", id: "staffnote", role: "status" },
        el("b", {}, "직원에게 이 화면을 보여 주세요"), el("p", {}, "내 방식으로 주문하는 중이에요. 도와주세요. 하던 주문은 그대로 있어요."),
        el("p", { class: "sub small" }, "(시제품: 이 휴대폰에서는 직원에게 신호가 가지 않아요)"),
        el("button", { type: "button", class: "ghost", onclick: closeStaffNote }, "알림 닫기"));
  document.body.append(note);
  // v0.7(A, WCAG 2.2 2.4.11): 알림이 열린 동안 내용을 알림 높이만큼 아래로 밀고(맨 위 메뉴도 가리지 않게), 초점이 알림 밑에 들어가면 그만큼 올려 보임
  const h = Math.ceil(note.getBoundingClientRect().bottom + 12);
  document.body.style.paddingTop = h + "px"; document.documentElement.style.scrollPaddingTop = h + "px";
  const msg = inDemo ? "직원을 불렀어요. 하던 주문은 그대로 있어요." : "직원에게 이 화면을 보여 주세요. 하던 주문은 그대로 있어요.";
  document.getElementById("live").textContent = msg;
  say(msg);
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.getElementById("staffnote")) closeStaffNote(); }); // v0.7(A): Esc로 닫기
document.addEventListener("focusin", (e) => {
  const n = document.getElementById("staffnote"); if (!n || n.contains(e.target) || e.target.closest("#bar")) return;
  const nb = n.getBoundingClientRect().bottom, r = e.target.getBoundingClientRect();
  if (r.top < nb + 4) window.scrollBy(0, r.top - nb - 12);
});
document.getElementById("cartbtn").onclick = () => go(confirmOrder);
// v0.4: 한 기기 시연의 방식 단추가 # 뒤만 바꾸면 프로필을 다시 읽어 처음 화면으로
window.addEventListener("hashchange", () => {
  const p = profileFromUrl();
  if (!p) return;
  profile = p; codes = applyProfile(profile); applyPlan(); firstScreen = true; home();
});
start();
</script>
